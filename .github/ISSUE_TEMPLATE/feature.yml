name: Feature proposal
description: Propose a focused capability or invariant improvement.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete workflow or failure mode, not only the desired implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user or Agent be able to observe after this is implemented?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Primary layer
      options:
        - Durable Task and session continuity
        - Authority, permission, approval, or audit
        - Agent coordination
        - Execution tool or Tool Pack
        - Remote host, Tunnel, or recovery
        - Renderer / Runtime update and cutover
        - Desktop experience
        - Documentation or contributor experience
        - Android or another device endpoint
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why this belongs in Sovereign
      description: Explain how it supports durable work, bounded authority, or governed evolution rather than duplicating a model client or generic Agent framework.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Invariants and failure behavior
      description: Which ownership, workspace, revision, approval, idempotency, evidence, or fencing rules must remain true? What should fail closed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include a smaller solution, external integration, or documentation-only option when applicable.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Describe the deterministic test, packaged smoke, or physical-environment acceptance needed before the feature can be claimed complete.
    validations:
      required: true
