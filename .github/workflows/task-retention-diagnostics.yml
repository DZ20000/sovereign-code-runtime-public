name: Task retention diagnostics

on:
  push:
    branches: [diagnostics/task-retention-20260928]

permissions:
  contents: read

jobs:
  capacity-profile:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.0'
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:runtime
      - name: Profile and uninstrumented control with normal durability
        shell: pwsh
        run: |
          $canonicalTemp = node --input-type=module -e "import { realpathSync } from 'node:fs'; process.stdout.write(realpathSync.native(process.env.TEMP));"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($canonicalTemp)) { throw 'Invalid temporary directory' }
          $env:TEMP = $canonicalTemp
          $env:TMP = $canonicalTemp
          node scripts/task-retention-profile.mjs profile
          $profileExit = $LASTEXITCODE
          node scripts/task-retention-profile.mjs control
          $controlExit = $LASTEXITCODE
          if ($profileExit -ne 0 -or $controlExit -ne 0) { exit 1 }
      - name: Verify source integrity
        if: always()
        shell: pwsh
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git ls-files --others --exclude-standard) { throw 'Unexpected untracked source' }
