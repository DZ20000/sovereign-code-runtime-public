name: Android CodeQL

on:
  push:
    branches:
      - main
    paths:
      - 'apps/android-agent/**'
      - '.github/workflows/codeql-android.yml'
  pull_request:
    paths:
      - 'apps/android-agent/**'
      - '.github/workflows/codeql-android.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

concurrency:
  group: codeql-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Verify Java and Android SDK
        shell: bash
        run: |
          java -version
          test -n "${ANDROID_HOME:-}"

      - name: Build Android sources for CodeQL
        shell: bash
        run: |
          chmod +x apps/android-agent/gradlew
          ./apps/android-agent/gradlew -p apps/android-agent testDebugUnitTest --no-daemon

      - name: Analyze Java and Kotlin
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:java-kotlin
