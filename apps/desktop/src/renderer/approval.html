<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sovereign approval</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./v2.css" />
  </head>
  <body data-ui-surface="approval">
    <main class="approval-shell v2-approval-dialog" data-phase="loading" data-risk="normal" aria-labelledby="approval-title">
      <section class="approval-content v2-approval-content" tabindex="0" aria-label="Approval request">
        <header class="approval-header v2-dialog-header">
          <div class="v2-dialog-title-row">
            <h1 id="approval-title">Loading request…</h1>
            <button id="approval-close" class="button button-ghost v2-icon-button" type="button" aria-label="Close" disabled><span aria-hidden="true">×</span></button>
          </div>
          <p id="approval-subtitle" class="v2-secondary">Independent approval window</p>
        </header>
        <div class="v2-approval-status">
          <span id="approval-status" class="v2-status">Loading</span>
          <span id="approval-countdown" class="approval-countdown" role="timer" aria-live="off" data-no-i18n>—</span>
        </div>
        <div class="v2-approval-facts">
          <p id="approval-requester" class="v2-requester" data-no-i18n>—</p>
          <p id="approval-target" class="v2-target" data-no-i18n>—</p>
          <p class="v2-secondary v2-approval-tool-meta"><span id="approval-workspace" data-no-i18n></span><code id="approval-tool" data-no-i18n>—</code></p>
        </div>
        <p id="approval-message" class="approval-message v2-secondary"></p>
        <p id="approval-guidance" class="v2-muted"></p>
        <details class="approval-details v2-approval-details">
          <summary id="approval-detail-label">Request details</summary>
          <pre id="approval-detail" class="approval-detail" data-no-i18n></pre>
        </details>
      </section>
      <footer class="approval-actions v2-dialog-actions">
        <p id="approval-feedback" class="approval-feedback" role="status" aria-live="polite" aria-atomic="true"></p>
        <button id="approval-drop" class="button button-secondary" type="button" hidden disabled>Deny all &amp; drop to L1</button>
        <span class="approval-spacer"></span>
        <button id="approval-deny" class="button button-secondary" type="button" disabled>Deny</button>
        <button id="approval-allow" class="button button-primary" type="button" disabled>Allow once</button>
        <button id="approval-return" class="button button-primary" type="button" hidden>Return to approval center</button>
      </footer>
    </main>
    <script type="module" src="./approval.ts"></script>
  </body>
</html>
